name: Python application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # Используем свежий образ Ubuntu

    strategy:
      matrix:
        python-version: ["3.10"]  # Меняем версию Python на 3.10

    steps:
    - uses: actions/checkout@v3  # Клонируем репозиторий

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Устанавливаем зависимости

    - name: Run tests
      run: |
        pytest  # Запускаем тесты, если есть

    - name: Check Streamlit Installation
      run: |
        streamlit --help  # Проверяем установку Streamlit
