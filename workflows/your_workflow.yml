name: CI/CD Pipeline for Streamlit App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Test, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          pip install flake8
          flake8 streamlit_app.py

      - name: Run tests
        run: |
          # Предположим, у вас есть тесты в tests/ или внутри файла
          # Для примера — запуск тестов с pytest
          pip install pytest
          pytest tests/

      - name: Start Streamlit app in background
        run: |
          nohup streamlit run streamlit_app.py --server.port=8501 > streamlit.log 2>&1 &
          sleep 10

      - name: Check if Streamlit app is running
        run: |
          curl -s --fail http://localhost:8501 || exit 1

      - name: Upload logs for debugging
        if: failure()
        run: |
          tail -n 50 streamlit.log
