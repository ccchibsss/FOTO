name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-run:
    name: Build, Test, and Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Streamlit app
        run: |
          # Запускаем Streamlit в фоновом режиме
          nohup streamlit run streamlit_app.py > streamlit.log 2>&1 &
          
          # Можно добавить задержку, чтобы убедиться, что приложение запустилось
          sleep 10
          
          # Вывод логов для проверки
          tail -n 20 streamlit.log
